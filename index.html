<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic_tac_toe_Game</title>
    <link rel ="stylesheet" href ="style.css">
</head>
<body>
    <div class="msg-container hide">
        <p id ="msg"><b>Winner</b></p>
        <button id ="new-btn"> New Game</button>
    </div>
    <main>
        <h1>TIC TAC TOE </h1>
        <div class="container">
            <div class="game">
                <button class="box" title="Cell 1" aria-label="Cell 1"></button>
                <button class="box" title="Cell 2" aria-label="Cell 2"></button>
                <button class="box" title="Cell 3" aria-label="Cell 3"></button>
                <button class="box" title="Cell 4" aria-label="Cell 4"></button>
                <button class="box" title="Cell 5" aria-label="Cell 5"></button>
                <button class="box" title="Cell 6" aria-label="Cell 6"></button>
                <button class="box" title="Cell 7" aria-label="Cell 7"></button>
                <button class="box" title="Cell 8" aria-label="Cell 8"></button>
                <button class="box" title="Cell 9" aria-label="Cell 9"></button>
            </div>
        </div>
        <button id = "reset-btn"> Reset Game</button>
    </main>
    
    
    
    <script src = "script.js"></script>
</body>

</html>
